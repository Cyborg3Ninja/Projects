<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <link rel="icon" href="html5.png" type="image/x-icon" />
    <link rel="stylesheet" href="style.css" type="text/css" />
  </head>
  <body>
    <h1>This is page 5</h1>
    <a href="index4.html" target="_self" title="page 4">link to page 4</a>
    <a href="index6.html" target="_self" title="page 6">link to page 5</a>
    <br />
    <!-- Send data to index.php -->
    <form action="index.php" method="POST">
      <label for="title">title:</label>
      <label for="Mr.">Mr.</label>
      <input type="radio" id="Mr." value="Mr." name="title" />
      <label for="Ms.">Ms.</label>
      <input type="radio" id="Ms." value="Ms." name="title" />
      <label for="PhD.">PhD.</label>
      <input type="radio" id="PhD." value="PhD." name="title" />
      <!-- name = select only one of the same group -->
      <br />

      <label for="username">username: </label>
      <input
        type="text"
        id="username"
        placeholder="Spongebob"
        minlength="6"
        maxlength="15"
        required
      />
      <br />
      <!-- placeholder = shown text. id= variable name -->

      <label for="password">password:</label>
      <input
        type="password"
        id="password"
        minlength="6"
        maxlength="15"
        required
      />
      <br />
      <label for="email">email:</label>
      <input
        type="email"
        id="email"
        placeholder="SSpongebob@gmail.com"
        minlength="6"
        maxlength="15"
        required
      />
      <br />
      <label for="phone">phone #:</label>
      <input
        type="tel"
        id="phone"
        placeholder="132-123-7890"
        pattern="[0-9]{3}-[0-9]{3}-[0-9]-{4}"
        required
      />
      <br />

      <label for="bday">birthdate:</label>
      <input type="date" id="bday" required />
      <!-- date: allows to use calendar option -->
      <br />
      <label for="quantity">quantity:</label>
      <input type="number" id="quantity" min="0" max="99" required />
      <!-- number allows up down arrow (for value) -->
      <br />

      <!-- Dropdown menu -->
      <label for="payment">payment:</label>
      <select id="payment">
        <option value="visa">visa</option>
        <option value="mastercard">mastercard</option>
        <option value="giftcard">giftcard</option>
      </select>
      <br />
      <!-- Checkbox -->
      <label for="subscribe">subscribe:</label>
      <input type="checkbox" id="subscribe" /> <br />

      <input type="reset" />
      <input type="submit" />
    </form>
  </body>
</html>
