<!doctype html>
<html lang="en">

  <body>
    <h1>This is page 3</h1>

    <!--controls can be autoplay + muted, loop-->
    <hr />
    <p>normal</p>
    <p><b>bold</b></p>
    <p><i>italic</i></p>
    <p><u>underline</u></p>
    <p><ins>inserted</ins></p>
    <p><s>strikethrough</s></p>
    <p><del>deleted</del></p>
    <p><mark>marked</mark></p>
    <p><big>big</big></p>
    <p>Hello <small>small</small> Hello</p>
    <p>Hello <sub>subscript</sub> Hello</p>
    <p>Hello <sup>superscript</sup> Hello</p>
    <hr />

        <th width="100">Wednesday </th>

        <th width="100">Friday </th>
        <th width="100">Saturday </th>

      <!--th= table headers-->
      <tr bgcolor="white" style="color: black" align="center">
        <td>Closed</td>
        <td>9-5</td>
        <td>9-5</td>
